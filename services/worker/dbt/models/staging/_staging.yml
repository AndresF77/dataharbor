version: 2

models:
  - name: stg_orders
    description: Typed, de-duplicated orders (registry dataset `stg_orders`).
    columns:
      - name: order_id
        description: Source order id; one row each.
      - name: customer_id
        description: Customer the order belongs to.
      - name: quantity
        description: Units ordered.
      - name: unit_price
        description: Price per unit in `currency`.
      - name: amount
        description: Order total in `currency` (quantity × unit price).
      - name: currency
        description: ISO 4217 code, upper case.
      - name: status
        description: "`completed` or `cancelled`."
      - name: ordered_at
        description: When the order was placed.
      - name: order_date
        description: UTC calendar date of `ordered_at`.
      - name: business_date
        description: Business date of the landed file the row came from.
      - name: source_file_sha256
        description: SHA-256 of that landed file.

  - name: stg_payments
    description: Typed payments with orphan rows flagged (registry dataset `stg_payments`).
    columns:
      - name: payment_id
        description: Source payment id; one row each.
      - name: order_id
        description: Order the payment is for.
      - name: method
        description: Payment method, lower case.
      - name: amount
        description: Amount paid in `currency`.
      - name: currency
        description: ISO 4217 code, upper case.
      - name: status
        description: Provider status, lower case (`captured` in the fixtures).
      - name: paid_at
        description: When the payment was made.
      - name: paid_date
        description: UTC calendar date of `paid_at`.
      - name: business_date
        description: Business date of the landed file the row came from.
      - name: source_file_sha256
        description: SHA-256 of that landed file.
      - name: has_known_order
        description: False when no order in `stg_orders` has this `order_id` (orphan payment).
