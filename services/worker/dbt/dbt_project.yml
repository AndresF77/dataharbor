# DataHarbor warehouse transformations (dbt Core, PostgreSQL `warehouse` database).
# raw.* tables are filled by `python -m dataharbor_worker load-raw`;
# see services/worker/README.md#dbt-project.
name: dataharbor
version: "0.1.0"
config-version: 2
require-dbt-version: [">=1.9.0", "<2.0.0"]

profile: dataharbor

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "logs"]

models:
  dataharbor:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: mart
      +materialized: table
